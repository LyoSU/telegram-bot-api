name: Sync, build & deploy

on:
  schedule:
    - cron: '17 4 * * *'   # щодня 04:17 UTC
  workflow_dispatch:
  push:
    branches: [custom]
    paths-ignore: ['FORK.md', 'README.md']

concurrency:
  group: sync-build-deploy
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  sync:
    # тільки за кроном/вручну; пуш у custom одразу йде в build
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.rebase.outputs.updated }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: custom
          fetch-depth: 0
      - name: Rebase onto upstream
        id: rebase
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/tdlib/telegram-bot-api.git
          git fetch upstream master
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo 'No new upstream commits'
            echo 'updated=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Конфлікт тут → крок падає → ран червоний → GitHub шле нотифікацію.
          git rebase upstream/master
          git push --force-with-lease origin custom
          echo 'updated=true' >> "$GITHUB_OUTPUT"

  build:
    needs: [sync]
    # запускається: після успішного sync з апдейтом; на ручний dispatch; на пуш у custom
    if: >
      !cancelled() && (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        needs.sync.outputs.updated == 'true'
      )
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm   # безплатний нативний ARM-раннер для публічних репо
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: custom          # свіжий стан після можливого force-push із sync
          submodules: recursive
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build gperf libssl-dev zlib1g-dev
      - uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ matrix.arch }}   # окремий ccache на кожну архітектуру
          max-size: 2G
      - name: Build
        run: |
          cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build --target telegram-bot-api
          # Dockerfile копіює binaries/${TARGETARCH}/telegram-bot-api; TARGETARCH=amd64|arm64
          mkdir -p binaries/${{ matrix.arch }} && cp build/telegram-bot-api binaries/${{ matrix.arch }}/
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          # Пушимо БЕЗ тегу, лише за digest — теги склеїть job merge у manifest list.
          outputs: type=image,name=ghcr.io/lyosu/telegram-bot-api,push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > /tmp/digests/${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/${{ matrix.arch }}
          retention-days: 1
          if-no-files-found: error

  merge:
    needs: [build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: custom
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - name: Extract version
        id: ver
        run: |
          VER=$(grep -oP 'project\(TelegramBotApi VERSION \K[0-9.]+' CMakeLists.txt)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Create multi-arch manifest list
        id: docker_build
        run: |
          IMAGE=ghcr.io/lyosu/telegram-bot-api
          # Зліплюємо per-arch digest-и (amd64 + arm64) в один тег із manifest list.
          REFS=""
          for f in /tmp/digests/*; do
            REFS="$REFS ${IMAGE}@$(cat "$f")"
          done
          docker buildx imagetools create \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${{ steps.ver.outputs.version }}" \
            $REFS
          # Digest самого manifest list — його пришпилюємо в Coolify.
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:latest" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Update image digest in Coolify and deploy
        if: ${{ vars.COOLIFY_DEPLOY_ENABLED == 'true' }}
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          SERVICE_UUID: ${{ secrets.COOLIFY_SERVICE_UUID }}
          DIGEST: ${{ steps.docker_build.outputs.digest }}
        run: |
          # Coolify не робить pull для :latest на redeploy — пришпилюємо новий
          # digest у compose через API і деплоїмо. Атомарно і детерміновано.
          # -f ховає тіло відповіді, тому статус перевіряємо самі і при помилці
          # друкуємо, що саме відповів Coolify (403 = права токена або IP-allowlist).
          api() {
            local out="$1"; shift
            local code
            code=$(curl -sS -H "Authorization: Bearer $API_TOKEN" -o "$out" -w '%{http_code}' "$@")
            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
              echo "::error::Coolify API returned HTTP $code for $* :"
              cat "$out"; echo
              exit 1
            fi
          }
          api service.json "$COOLIFY_URL/api/v1/services/$SERVICE_UUID"
          python3 - <<'EOF'
          import base64, json, re
          svc = json.load(open('service.json'))
          compose = svc['docker_compose_raw']
          digest = __import__('os').environ['DIGEST']
          # Coolify normalizes the YAML and may quote the image value — match both.
          compose = re.sub(
              r"image: '?ghcr\.io/lyosu/telegram-bot-api[@:][^\s']+'?",
              f"image: 'ghcr.io/lyosu/telegram-bot-api@{digest}'",
              compose)
          json.dump({'docker_compose_raw': base64.b64encode(compose.encode()).decode()},
                    open('patch.json', 'w'))
          EOF
          api /dev/null -X PATCH -H 'Content-Type: application/json' \
            --data @patch.json "$COOLIFY_URL/api/v1/services/$SERVICE_UUID"
          api /dev/null "$COOLIFY_URL/api/v1/deploy?uuid=$SERVICE_UUID"
          echo "Deployed $DIGEST"
